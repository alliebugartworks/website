<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Allie Bug Artwork</title>
  <meta name="description" content="Review and update your cart.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-title" id="site-title">Allie Bug Artwork</span>
        <span class="logo-tagline" id="site-tagline">Handmade art & original pieces</span>
      </a>
      <div class="header-actions">
        <nav class="header-contact" id="header-contact"></nav>
        <a href="cart.html" class="cart-link" id="cart-link" aria-label="View cart">
          <span>Cart</span>
          <span class="cart-count" id="cart-count" hidden>0</span>
        </a>
      </div>
    </div>
  </header>


  <main>
    <section class="cart-page">
      <div class="container">
        <div>
          <a href="index.html" class="back-link">← Back to gallery</a>
        </div>
        <div class="cart-header">
          <p class="eyebrow">Your order</p>
          <h1>Cart</h1>
        </div>
        <div id="cart-content">
          <p class="loading">Loading cart…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner" id="footer-contact"></div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/cart.js"></script>
</body>

</html>
