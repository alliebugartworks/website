<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie Bug Artwork</title>
  <meta name="description" content="Original handmade art and pieces for sale.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-title" id="site-title">Allie Bug Artwork</span>
        <span class="logo-tagline" id="site-tagline">Handmade art & Ariginal Pieces</span>
      </a>
      <div class="header-actions">
        <nav class="header-contact" id="header-contact"></nav>
        <a href="cart.html" class="cart-link" id="cart-link" aria-label="View cart">
          <span>Cart</span>
          <span class="cart-count" id="cart-count" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Available Works</h1>
        <p class="hero-subtitle" id="gallery-subtitle">Tap any piece to view details, photos, and pricing. You can order
          any of these pieces as is, customize, or work with me to commission a new piece.</p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="container">
        <div class="row gallery-toolbar" aria-label="Artwork filters">

          <button class="col filter-button active" type="button" data-filter="all">All</button>
          <button class="col filter-button" type="button" data-filter="cards">Cards</button>
          <button class="col filter-button" type="button" data-filter="felt">Felt</button>
          <button class="col filter-button" type="button" data-filter="paper">Paper</button>
          <button class="col filter-button" type="button" data-filter="prints">Prints</button>
          <button class="col filter-button" type="button" data-filter="commission">Commissions</button>

        </div>
        <div class="d-none">
          <div class="row subcategory-toolbar">

            <button class="col card-filter-button" type="button" data-filter="all">All</button>
            <button class="col card-filter-button" type="button" data-filter="birthday">Birthday</button>
            <button class="col card-filter-button" type="button" data-filter="thankyou">Thank You</button>
            <button class="col card-filter-button" type="button" data-filter="wedding">Wedding</button>
            <button class="col card-filter-button" type="button" data-filter="celebration">Celebration</button>
            <button class="col card-filter-button" type="button" data-filter="hello">Just Saying Hi</button>
            <button class="col card-filter-button" type="button" data-filter="halloween">Halloween</button>

          </div>
        </div>
        <div class="gallery-grid" id="gallery-grid">
          <p class="loading">Loading artwork…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner" id="footer-contact"></div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/gallery.js"></script>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>
</body>

</html>
