<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie Bug Artwork</title>
  <meta name="description" content="Original handmade art and pieces for sale.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-title" id="site-title">Allie Bug Artwork</span>
        <span class="logo-tagline" id="site-tagline">Handmade art & Ariginal Pieces</span>
      </a>
      <div class="header-actions">
        <nav class="header-contact" id="header-contact"></nav>
        <a href="cart.html" class="cart-link" id="cart-link" aria-label="View cart">
          <span>Cart</span>
          <span class="cart-count" id="cart-count" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Available Works</h1>
        <p class="hero-subtitle" id="gallery-subtitle">Tap any piece to view details, photos, and pricing. You can order any of these pieces as is, customize, or work with me to commission a new piece.</p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="container">
        <div class="gallery-toolbar" aria-label="Artwork filters">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="card">Cards</button>
          <button class="filter-button" type="button" data-filter="felt-piece">Felt</button>
                    <button class="filter-button" type="button" data-filter="paper">Paper</button>

           <button class="filter-button" type="button" data-filter="print">Prints</button>
                      <button class="filter-button" type="button" data-filter="commission">Commissions</button>

        </div>
        <div class="gallery-grid" id="gallery-grid">
          <p class="loading">Loading artwork…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner" id="footer-contact"></div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
